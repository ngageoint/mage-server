services:

  mage-db:
    image: mongodb/mongodb-community-server:8.0-ubi9-slim
    # Uncomment the following ports block to allow the mongo client on your
    # host machine to connect to MongoDB in the Docker container.
    ports:
      - 27017:27017
    volumes:
      - ./database/data:/data/db
    networks:
      - mage.net

  mage-server:
    depends_on: [ mage-db ]
    build:
      context: ./
      # dockerfile: Dockerfile-debug
    image: mage:local
    # entrypoint: ["./node_modules/.bin/mage.service", "--plugin", "@ngageoint/mage.image.service"]  Uncomment to specify new entrypoint commands
    platform: linux/amd64
    volumes:
      - ./server/resources:/var/lib/mage
      # - ./sftp-test/id_rsa:/run/secrets/sftp_key:ro
    # Comment the ports block to disallow connections directly to the node
    # server when running the mage-web-proxy below.
    ports:
      - 4242:4242
      # Uncomment to allow debuggers to attach the Node process inside the
      # container on port 14242
      # - 14242:14242
    networks:
      - mage.net
    environment:
      MAGE_MONGO_URL: mongodb://mage-db:27017/magedb
      MAGE_TOKEN_EXPIRATION: "28800"
      MAGE_PLUGINS: '{"servicePlugins":["@ngageoint/mage.sftp.service", "@ngageoint/mage.arcgis.service"],"webUIPlugins":["@ngageoint/mage.sftp.web", "@ngageoint/mage.arcgis.web-app"]}'
      MAGE_SFTP_KEY_FILE: /var/lib/mage/sftp_key

    # Uncomment this section to use Docker volumes instead of bind mounts for data directories:
    # volumes:
    #   "mongodb-data":
    #   "mage-server-resources":

  # Uncomment the following block to enable the TLS reverse proxy.  You will
  # also need to generate the key and certificate as the README describes.
  # mage-web-proxy:
  #   image: nginx
  #   volumes:
  #     - ./web/nginx.conf:/etc/nginx/nginx.conf
  #     - ./web/mage-web.crt:/etc/nginx/ssl/web.crt
  #     - ./web/mage-web.key:/etc/nginx/ssl/web.key
  #   ports:
  #     - 4280:80
  #     - 4243:4243
  #   networks:
  #     - mage.net

  # Uncomment the following block to enable the TLS reverse proxy.  You will
  # also need to generate the key and certificate as the README describes.
  # mage-web-proxy:
  #   image: nginx
  #   volumes:
  #     - ./web/nginx.conf:/etc/nginx/nginx.conf
  #     - ./web/mage-web.crt:/etc/nginx/ssl/web.crt
  #     - ./web/mage-web.key:/etc/nginx/ssl/web.key
  #   ports:
  #     - 4280:80
  #     - 4243:4243
  #   networks:
  #     - mage.net

  # Local SFTP server for development testing.
  # Uploaded zips land in ./sftp-test/upload/ on your Mac.
  # Connect the plugin to: host=mage-sftp, port=22, user=magetest, path=/upload
  mage-sftp:
    image: atmoz/sftp
    command: magetest::1001
    volumes:
      - ./sftp-test/id_rsa.pub:/home/magetest/.ssh/keys/id_rsa.pub:ro
      - ./sftp-test/upload:/home/magetest/upload
    ports:
      - "2222:22"
    networks:
      - mage.net

networks:
  mage.net:
    driver: bridge

# Uncomment this section to use Docker volumes instead of bind mounts for data directories:
# volumes:
#   "mongodb-data":
#   "mage-server-resources":
