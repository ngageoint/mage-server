services:

  # Add ClamAV to build local container for testing
  mage-clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    volumes:
      - ./docker/clamav:/var/lib/clamav
    ports:
      - "3310:3310"
    networks:
      - mage.net

  mage-db:
    image: mongodb/mongodb-community-server:8.3-ubi9-slim
    # Uncomment the following ports block to allow the mongo client on your
    # host machine to connect to MongoDB in the Docker container.
    ports:
      - 27017:27017
    volumes:
      - ./docker/mage/db:/data/db
    networks:
      - mage.net

  mage-server:
    depends_on: [ mage-db ]
    build:
      context: ./
      tags:
        - mage:local
    image: mage:local
    command:
      - ./mage.service
      - --plugin
      - '@ngageoint/mage.image.service'
      - --plugin
      - '@ngageoint/mage.sftp.service'
      - --web-plugin
      - '@ngageoint/mage.sftp.web'
      - --plugin
      - '@ngageoint/mage.arcgis.service'
      - --web-plugin
      - '@ngageoint/mage.arcgis.web-app'
      - --plugin
      - '@ngageoint/mage.clamav.service'
    volumes:
      - ./docker/mage/resources:/var/lib/mage
      - ./docker/sftp/key/id_rsa:/run/secrets/mage/sftp_key:ro
    # Comment the ports block to disallow connections directly to the node
    # server when running the mage-web-proxy below.
    ports:
      - 4242:4242
      # Uncomment to allow debuggers to attach the Node process inside the
      # container on port 14242
      # - 14242:14242
    networks:
      - mage.net
    environment:
      MAGE_MONGO_URL: mongodb://mage-db:27017/magedb
      MAGE_TOKEN_EXPIRATION: "28800"
      # Only used if @ngageoint/mage.clamav.service is enabled above - host/port
      # for the mage-clamav container this compose file already defines.
      MAGE_CLAMAV_HOST: mage-clamav
      MAGE_CLAMAV_PORT: "3310"
      MAGE_SFTP_KEY_FILE: /run/secrets/mage/sftp_key

  # Uncomment the following block to enable the TLS reverse proxy.  You will
  # also need to generate the key and certificate as the README describes.
  # mage-web-proxy:
  #   image: nginx
  #   volumes:
  #     - ./docker/web-proxy/nginx.conf:/etc/nginx/nginx.conf
  #     - ./docker/web-proxy/mage-web.crt:/etc/nginx/ssl/web.crt
  #     - ./docker/web-proxy/mage-web.key:/etc/nginx/ssl/web.key
  #   ports:
  #     - 4280:80
  #     - 4243:4243
  #   networks:
  #     - mage.net

  # Local SFTP server for development testing.
  # Uploaded zips land in ./docker/sftp/upload/ on your Mac.
  # Connect the plugin to: host=mage-sftp, port=22, user=mage, path=/upload
  mage-sftp:
    image: atmoz/sftp
    command: mage::1001
    volumes:
      - ./docker/sftp/key/id_rsa.pub:/home/mage/.ssh/keys/id_rsa.pub:ro
      - ./docker/sftp/upload:/home/mage/upload
    ports:
      - "2222:22"
    networks:
      - mage.net

networks:
  mage.net:
    driver: bridge

# Uncomment this section to use Docker volumes instead of bind mounts for data directories:
# volumes:
#   "mongodb-data":
#   "mage-server-resources":
