name: Production Container Build

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to build and tag the container with
        type: string
        required: true

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Login to Github Registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build --build-arg SERVICE_VERSION=${{ inputs.version }} --build-arg WEB_VERSION=${{ inputs.version}} -t ghcr.io/${{ github.repository }}/mage:${{ inputs.version }} ./docker/server

      - name: Push Image
        run: |
          docker push ghcr.io/${{ github.repository }}/mage:$IMAGE_TAG