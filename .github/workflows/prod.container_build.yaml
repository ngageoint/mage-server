name: Production Container Build

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The image tag
        type: string
        required: true
      server_version:
        description: the version of the web server_version
        type: string
        required: true
      arc_version:
        description: the version of the arc plugin
        type: string
        required: true
        default: NONE
      sftp_version:
        description: the version of the sftp plugin
        required: true
        default: NONE

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Pull IB Image
        run: |
          echo "{{ secrets.DELETE_TOKEN }}" | docker login registry1.dso.mil -u "${{ secrets.DELETE_USER }}" --password-stdin
          docker pull registry1.dso.mil/ironbank/opensource/nodejs/debian/nodejs:20.11.1 
          docker tag registry1.dso.mil/ironbank/opensource/nodejs/debian/nodejs:20.11.1 ghcr.io/${{ github.repository }}/ironbank/nodejs:20.11

      - name: Login to Github Registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: push IB image
        run: |
          docker push ghcr.io/${{ github.repository }}/ironbank/nodejs:20.11
