name: test and package clamav service plugin

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - .github/workflows/build_test.clamav.service.yaml
      - .github/workflows/config.yaml
      - plugins/clamav/service/**

jobs:
  config:
    uses: ./.github/workflows/config.yaml

  test:
    name: test plugin clamav.service
    needs: [config]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ${{ fromJSON(needs.config.outputs.node_versions-all-json) }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: |
            plugins/clamav/service/package-lock.json
      - name: build mage service
        run: |
          cd service
          npm ci
          npm run build
      - name: test with node ${{ matrix.node }}
        run: |
          cd plugins/clamav/service
          npm ci --force
          npm test

  package:
    name: package plugin clamav.service
    needs: [config, test]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.config.outputs.node_versions-lts }}
          cache: npm
          cache-dependency-path: |
            plugins/clamav/service/package-lock.json
      - name: build mage service
        run: |
          cd service
          npm ci
          npm run build
      - name: build clamav service
        run: |
          cd plugins/clamav/service
          npm ci --force
          npm run build
      - name: pack
        run: npm pack ./plugins/clamav/service
      - name: upload package
        uses: actions/upload-artifact@v7
        with:
          name: clamav.service-artifacts
          path: |
            ngageoint-mage.*.tgz
