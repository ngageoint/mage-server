name: release mage server

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version you want to assign to the release
        type: string
        required: true
      is_draft:
        description: Whether to mark this a draft release; publish will be dry run for drafts
        type: boolean
        required: false
        default: false
      is_prerelease:
        description: >
          When true, mark the GitHub release as a prerelease.  If true, the package version must be a prerelease
          version.
        type: boolean
        required: false
        default: true
      dist_tag:
        description: >
          Apply the given dist tag when publishing to NPM.  If omitted, the workflow will try to determine the dist
          tag from the package version prerelease tag.
        type: string
        required: false

jobs:
  config:
    uses: ./.github/workflows/config.yaml

  check_release_version:
    needs: [config]
    runs-on: ubuntu-latest
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.config.outputs.node_versions-lts }}
      - name: package info
        id: package_info
        uses: ./.github/actions/package_info
        with:
          package_path: ./package.json
      - name: install json util
        run: npm i -g json
      - name: check project
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $(json version < ./package.json) = "${VERSION}" ]] || exit 1
      - name: check service
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $(json version < ./service/package.json) = "${VERSION}" ]] || exit 1
      - name: check web-app
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $(json version < ./web-app/package.json) = "${VERSION}" ]] || exit 1
      - name: check web-core-lib
        env:
          VERSION: ${{ inputs.version }}
        run: |
          [[ $(json version < ./web-app/projects/core-lib/package.json) = "${VERSION}" ]] || exit 1
      - name: check prerelease
        env:
          IS_PRERELEASE: ${{ inputs.is_prerelease }}
          PRERELEASE_TAG: ${{ steps.package_info.outputs.version-prerelease_tag }}
        run: |
          if ( [ "${IS_PRERELEASE}" != "false" ] &&  [ -z "${PRERELEASE_TAG}" ] )
          then
            echo "ERROR: Prereleases must publish a package version with a prerelease component."
            exit 1
          fi

  build_and_test-service:
    needs: [check_release_version]
    uses: ./.github/workflows/build_test.service.yaml

  build_and_test-web-app:
    needs: [check_release_version]
    uses: ./.github/workflows/build_test.web-app.yaml

  sonarqube_report:
    needs: [check_release_version]
    uses: ./.github/workflows/sonarqube.yaml
    with:
      version: ${{ inputs.version }}
    secrets: inherit

  create_release:
    name: create release
    needs: [config, build_and_test-service, build_and_test-web-app, sonarqube_report]
    runs-on: ubuntu-latest
    steps:
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.config.outputs.node_versions-lts }}
      - name: install json util
        run: npm i -g json
      - name: download service artifacts
        uses: actions/download-artifact@v8
        with:
          name: mage.service-artifacts
      - name: download web-app artifacts
        uses: actions/download-artifact@v8
        with:
          name: mage.web-app-artifacts
      - name: download sonarqube report
        uses: actions/download-artifact@v8
        with:
          name: sonarqube-report
      - name: generate instance package.json
        env:
          VERSION: ${{ inputs.version }}
        run: |
          (
          printf '{ "name": "mage.instance", "version": "%s" }\n' "${VERSION}" &&
          printf '{ "scripts": { "start": "mage.service" }}\n' &&
          printf '{ "dependencies": { "@ngageoint/mage.service": "./%s" }}\n' $(ls -1 *mage.service*.tgz) &&
          printf '{ "dependencies": { "@ngageoint/mage.web-app": "./%s" }}\n' $(ls -1 *mage.web-app*.tgz)
          ) | json --deep-merge > package.json
          echo "instance package.json"
          cat package.json
      - name: create release
        uses: softprops/action-gh-release@v3
        with:
          name: ${{ inputs.version }}
          prerelease: ${{ inputs.is_prerelease }}
          draft: ${{ inputs.is_draft }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          files: |
            package.json
            ngageoint-mage.*.tgz
            mage-*-sonarqube.json

  publish_packages:
    name: publish packages
    needs: [config, create_release]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: setup node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ needs.config.outputs.node_versions-lts }}
          registry-url: "https://registry.npmjs.org"
      - name: checkout
        uses: actions/checkout@v7
      - name: package info
        id: package_info
        uses: ./.github/actions/package_info
        with:
          package_path: ./package.json
      - name: determine dist tag
        id: dist-tag
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
          PRERELEASE_TAG: ${{ steps.package_info.outputs.version-prerelease_tag }}
        run: |
          dist_tag_switch=""
          dist_tag="${DIST_TAG}"
          [ -z "${dist_tag}" ] && dist_tag="${PRERELEASE_TAG}"
          if [[ ! "${dist_tag}" =~ ^[A-Za-z0-9._-]*$ ]]
          then
            echo "ERROR: dist tag may only contain letters, numbers, '.', '-', and '_'."
            exit 1
          fi
          [ -n "${dist_tag}" ] && dist_tag_switch="--tag ${dist_tag}"
          echo "dist_tag_switch=${dist_tag_switch:-""}" >> $GITHUB_ENV
      - name: download service packages
        uses: actions/download-artifact@v8
        with:
          name: mage.service-artifacts
          path: ./scratch/
      - name: download web-app packages
        uses: actions/download-artifact@v8
        with:
          name: mage.web-app-artifacts
          path: ./scratch/
      - name: dry run publish
        run: |
          echo "using dist tag switch: ${dist_tag_switch}"
          eval "npm publish --dry-run --access public ${dist_tag_switch} $(ls -1 ./scratch/ngageoint-mage.service-*.tgz)"
          eval "npm publish --dry-run --access public ${dist_tag_switch} $(ls -1 ./scratch/ngageoint-mage.web-app-*.tgz)"
          eval "npm publish --dry-run --access public ${dist_tag_switch} $(ls -1 ./scratch/ngageoint-mage.web-core-lib-*.tgz)"
      - name: publish service package
        if: ${{ ! inputs.is_draft }}
        continue-on-error: true
        run: |
          eval "npm publish --access public ${dist_tag_switch} $(ls -1 ./scratch/ngageoint-mage.service-*.tgz)"
      - name: publish web-app package
        if: ${{ ! inputs.is_draft }}
        continue-on-error: true
        run: |
          eval "npm publish --access public ${dist_tag_switch} $(ls -1 ./scratch/ngageoint-mage.web-app-*.tgz)"
      - name: publish web-core-lib package
        if: ${{ ! inputs.is_draft }}
        continue-on-error: true
        run: |
          eval "npm publish --access public ${dist_tag_switch} $(ls -1 ./scratch/ngageoint-mage.web-core-lib-*.tgz)"

