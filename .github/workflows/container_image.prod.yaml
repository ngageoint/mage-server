name: Production Container Build

on:
  workflow_dispatch:
    inputs:
      image-packages:
        description: |
          Indicate whether to build the image from the the locally built packages, or from packages published in the
          NPM registry.
        type: choice
        options:
          - local
          - published
        default: local
      image-tag:
        description: |
          Supply a tag to push the image to the ghcr.io registry.  Without a tag, the workflow will not push,
          but only build the image.  If the workflow runs from the develop branch, the image will  implicitly 
          receive the 'dev' tag.  Examples: `6.7.0-beta.1` or `feature-123`.
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  image-info:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.image-info.outputs.tag }}
      url: ${{ steps.image-info.outputs.url }}
      version: ${{ steps.image-info.outputs.version }}
      dockerfile: ${{ steps.image-info.outputs.dockerfile }}
    steps:
      - name: install node.js
        uses: actions/setup-node@v7

      - name: checkout
        uses: actions/checkout@v7

      - name: image-info
        id: image-info
        run: |
          image_tag="local"
          [[ ${{ github.ref }} = 'refs/heads/develop' ]] && image_tag="dev"
          [[ -n "${{ inputs.image-tag }}" ]] && image_tag="${{ inputs.image-tag }}"
          image_url="${{ github.repository }}/mage:${image_tag}"
          image_dockerfile="Dockerfile"
          image_version=$(jq -r .version < ./service/package.json)
          if [[ "${{ inputs.image-packages }}" = "published" ]]
          then
            image_dockerfile="Dockerfile.published"
            image_version=$(npm info @ngageoint/mage.service@latest version)
          fi
          echo "using image url ${image_url}"
          echo "tag=${image_tag}" >> $GITHUB_OUTPUT
          echo "url=ghcr.io/${image_url}" >> $GITHUB_OUTPUT
          echo "version=${image_version}" >> $GITHUB_OUTPUT
          echo "dockerfile=./${image_dockerfile}" >> $GITHUB_OUTPUT

