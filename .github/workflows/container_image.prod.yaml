  build-and-push:
    needs: image-info
    runs-on: ubuntu-latest
    steps:
      - name: Login to Github Registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: checkout
        uses: actions/checkout@v7

      - name: Docker - Install QEMU
        uses: docker/setup-qemu-action@v4

      - name: Docker - Install buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          file: ${{ needs.image-info.outputs.dockerfile }}
          tags: ${{ needs.image-info.outputs.url }}
          platforms: linux/amd64,linux/arm64
          push: ${{ needs.image-info.outputs.tag != 'local' }}
          annotations: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.image-info.outputs.version }}

      - name: Extract package-lock
        run: |
          docker create --name mage-files ${{ needs.image-info.outputs.url }}
          docker cp mage-files:/mage/instance/package-lock.json ./mage-instance.package-lock.json
          docker rm mage-files

      - name: Upload package-lock
        uses: actions/upload-artifact@v7
        with:
          name: mage-instance.package-lock.json
          path: mage-instance.package-lock.json

      - name: Scan the docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: 'image'
          image-ref: '${{ needs.image-info.outputs.url }}'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '0'
          version: 'v0.69.3'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v7
        with:
          name: trivy-container-security-report
          path: trivy-image-report.txt
          retention-days: 7
