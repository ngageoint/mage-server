name: Dev Container Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Set IMAGE_TAG
        run: |
          if [[ "${{ github.ref_name }}" == "test" ]]; then
            echo "IMAGE_TAG=test" >> $GITHUB_ENV
          else
            echo "IMAGE_TAG=dev" >> $GITHUB_ENV
          fi

      - name: Login to Github Registry ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build -t ghcr.io/${{ github.repository }}/mage:$IMAGE_TAG .

      - name: Scan the docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0 
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/${{ github.repository }}/mage:${{ env.IMAGE_TAG }}'
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '0'
          version: 'v0.69.3'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-security-report
          path: trivy-image-report.txt
          retention-days: 7

      - name: Push Image
        if: github.ref =='refs/heads/test' || github.ref =='refs/heads/develop'
        run: |
          docker push ghcr.io/${{ github.repository }}/mage:$IMAGE_TAG
