name: Dev Container Build

on:
  push:
    branches:
      - "**"
  workflow_dispatch:
    inputs:
      image-tag:
        description: Supply a tag to push the image to ghcr.io with the given tag.
        type: string
        required: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v7

      - name: Login to Github Registry ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image
        run: |
          docker build \
          -t ghcr.io/${{ github.repository }}/mage:dev \
          --annotation "org.opencontainers.image.revision=${{ github.sha }}" .

      - name: Scan the docker image with Trivy
        uses: aquasecurity/trivy-action@v0.35.0 
        with:
          scan-type: 'image'
          image-ref: 'ghcr.io/${{ github.repository }}/mage:dev'
          ignore-unfixed: true
          format: 'table'
          output: 'trivy-image-report.txt'
          exit-code: '0'
          version: 'v0.69.3'

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        with:
          name: trivy-container-security-report
          path: trivy-image-report.txt
          retention-days: 7

      - name: Push Image
        if: github.ref == 'refs/heads/develop' || inputs.image-tag
        run: |
          image_tag="${{ inputs.image-tag }}" || "dev"
          docker push ghcr.io/${{ github.repository }}/mage:${image_tag}
