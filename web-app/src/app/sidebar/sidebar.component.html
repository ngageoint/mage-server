<div class="feeds-nav">
  <div *ngFor="let tab of tabs" (click)="onTabSwitched(tab)">
    <sidebar-tab [tab]="tab" [active]="tab.id === currentTab?.id"></sidebar-tab>
  </div>

  <mat-divider></mat-divider>

  <div class="export-tab" (click)="onTabSwitched(exportTab)">
    <sidebar-tab [tab]="exportTab" [active]="exportTab.id === currentTab?.id"></sidebar-tab>
  </div>
</div>

<div class="feeds-content">
  <user-view *ngIf="viewUser" animate.enter="component__view--enter" animate.leave="component__view--leave" class="component__view" [class.reselected]="userReselected" (animationend)="userReselected = false" [user]="viewUser" (close)="onUserViewClose()"></user-view>

  <observation-view *ngIf="viewObservation" animate.enter="component__view--enter" animate.leave="component__view--leave" class="component__view" [class.reselected]="observationReselected" (animationend)="observationReselected = false" [event]="event" [observation]="viewObservation" (closed)="onObservationViewClose()" (delete)="onObservationDelete($event)"></observation-view>
  <observation-edit *ngIf="editObservation" animate.enter="component__view--enter" animate.leave="component__view--leave" class="component__view" [observation]="editObservation" (close)="onObservationEditClose($event)"></observation-edit>
  <observation-edit *ngIf="newObservation" animate.enter="component__view--enter" animate.leave="component__view--leave" class="component__view" [observation]="newObservation" (close)="onObservationEditClose($event)"></observation-edit>

  <feed-item *ngIf="feedItem" animate.enter="component__view--enter" animate.leave="component__view--leave" class="component__view" [item]="feedItem.item" [feed]="feedItem.feed"></feed-item>

  <export-view *ngIf="viewExport" animate.enter="component__view--enter" animate.leave="component__view--leave" class="component__view" [item]="viewExport" (close)="onExportViewClose()"></export-view>

  <observation-list class="feed-container" *ngIf="currentTab.id === 'observations'"></observation-list>
  <user-list class="feed-container" *ngIf="currentTab.id === 'people'"></user-list>
  <feed-list class="feed-container" [feed]="currentTab.feed" *ngIf="currentTab.feed"></feed-list>
  <export class="feed-container" *ngIf="currentTab.id === 'export'"></export>
</div>
