<div class="tab">
  <div class="tab-icon" matBadge="{{tab?.count}}" matBadgePosition="above after" matBadgeSize="small"
    [matBadgeHidden]="!tab?.count">
    <div *ngIf="tab?.iconUrl" class="img" [ngClass]="{'img__active': active}" [ngStyle]="imageStyle"></div>
    <mat-icon *ngIf="tab?.icon" fontSet="material-symbols-outlined" [ngClass]="{'icon__active': active, 'icon': true }" [matTooltip]="tab?.title"
      matTooltipPosition="right">
      {{tab.icon}}
    </mat-icon>
  </div>
</div>
