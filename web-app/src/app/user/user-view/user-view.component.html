<mat-toolbar>
  <mat-toolbar-row class="navigation">
    <button matIconButton (click)="onClose()">
      <mat-icon>arrow_back</mat-icon>
    </button>
  </mat-toolbar-row>
</mat-toolbar>

<div class="user-container">
  <mat-card class="user-card">
    <mat-card-content>
      <div class="user-map">
        <div class="user-map__view">
          <map-clip [feature]="user.location" [accuracy]="accuracy"></map-clip>
        </div>
      </div>

      <div class="user-avatar">
        <div class="user-avatar__border"></div>
        <div class="user-avatar__img">
          <user-avatar [user]="user.user" avatarWidth="110" avatarHeight="110"></user-avatar>
        </div>
      </div>

      <div class="user__name">{{user.user.displayName}}</div>

      <mat-divider></mat-divider>

      <mat-action-list>
        <mat-list-item (click)="onUserLocationClick()" class="row-location">
          <mat-icon matListItemIcon>my_location</mat-icon>
          <span matListItemTitle>{{user.location.geometry | geometry:5}}</span>
          <span matListItemMeta class="user__location--accuracy">
            <span class="user__location--provider">{{user.location.properties.provider}}</span>
            &#177; {{user.location.properties.accuracy | number:'0.0-5'}}m
          </span>
        </mat-list-item>

        <a mat-list-item href="tel:{{user.user.phones[0].number}}" *ngIf="user.user?.phones?.length" class="row-phone">
          <mat-icon matListItemIcon>phone</mat-icon>
          <span matListItemTitle>{{user.user.phones[0].number}}</span>
        </a>

        <a mat-list-item href="mailto:{{user.user.email}}" *ngIf="user.user.email" class="row-email">
          <mat-icon matListItemIcon>email</mat-icon>
          <span matListItemTitle>{{user.user.email}}</span>
        </a>
      </mat-action-list>
    </mat-card-content>
  </mat-card>

    <div class="user-observations__subheader">Observations</div>
    <cdk-virtual-scroll-viewport itemSize="50" class="listViewPort">

        <observation-list-item [observation]="observation" [event]="event" [form]="event.form"></observation-list-item>
      </div>
    </cdk-virtual-scroll-viewport>
  </div> -->
</div>
