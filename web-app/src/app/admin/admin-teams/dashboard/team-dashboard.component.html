<ng-template #breadcrumbActions>
  <div class="nav-actions">
    <button matButton="filled" *ngIf="hasTeamCreatePermission" (click)="createTeam()">
      <mat-icon>add</mat-icon>New Team
    </button>
  </div>
</ng-template>

<div class="teams-page">
  <mat-card appearance="raised" class="teams-card">
    <mat-card-header>
      <mat-card-title>Teams</mat-card-title>
    </mat-card-header>

    <div class="toolbar">
      <mat-form-field appearance="fill" subscriptSizing="dynamic" class="search-field">
        <mat-icon matPrefix>search</mat-icon>
        <mat-label>Search teams</mat-label>
        <input matInput [(ngModel)]="searchTerm" (ngModelChange)="onSearchTermChanged($event)" autocomplete="off">
        <button matSuffix matIconButton *ngIf="searchTerm" (click)="onSearchCleared()" aria-label="Clear">
          <mat-icon>close</mat-icon>
        </button>
      </mat-form-field>
    </div>

    <mat-nav-list *ngIf="teams.length; else noTeams">
      <mat-list-item *ngFor="let team of teams" [routerLink]="['../teams', team.id]">
        <mat-icon matListItemIcon>groups</mat-icon>
        <span matListItemTitle>{{ team.name }}</span>
        <span matListItemLine *ngIf="team.description">{{ team.description }}</span>
      </mat-list-item>
    </mat-nav-list>

    <ng-template #noTeams>
      <div class="empty-state">
        <mat-icon fontSet="material-symbols-outlined" class="empty-state-icon">groups</mat-icon>
        <div class="empty-state-text" *ngIf="searchTerm; else noTeamsFound">No teams match your search</div>
        <ng-template #noTeamsFound>
          <div class="empty-state-text">No teams found</div>
        </ng-template>
      </div>
    </ng-template>

    <mat-paginator
      [length]="totalTeams"
      [pageSize]="pageSize"
      [pageIndex]="pageIndex"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card>
</div>
