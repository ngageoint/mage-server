<div class="preview-container">
  <div *ngIf="shouldShowMap()" class="map-wrapper">
    <div #mapContainer class="layer-preview-map"></div>
  </div>

  <div *ngIf="!shouldShowMap()" class="no-preview">
    <div class="no-preview-content">
      <mat-icon fontSet="material-symbols-outlined" class="no-preview-icon">map</mat-icon>
      <p class="no-preview-text">Map preview only available for imagery and feature layers.</p>
    </div>
  </div>
</div>
