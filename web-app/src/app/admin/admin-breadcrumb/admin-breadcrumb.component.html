<mat-toolbar class="admin-breadcrumbs">
  <ng-container *ngFor="let breadcrumb of breadcrumbs; index as i">
    <mat-icon *ngIf="breadcrumb.icon" fontSet="material-symbols-outlined">{{ breadcrumb.icon }}</mat-icon>

    <i *ngIf="breadcrumb.iconClass" [ngClass]="breadcrumb.iconClass.split(' ')" aria-hidden="true"></i>

    <div>
      <a *ngIf="breadcrumb.route && (breadcrumb.route | slice:0:1).length; else activeBreadcrumb"
        class="admin-breadcrumb" [routerLink]="breadcrumb.route">
        {{ breadcrumb.title }}
      </a>

      <ng-template #activeBreadcrumb>
        <span class="admin-breadcrumb admin-breadcrumb--active">
          {{ breadcrumb.title }}
        </span>
      </ng-template>
    </div>

    <span *ngIf="i < breadcrumbs.length - 1" class="admin-breadcrumb__separator">/</span>
  </ng-container>
  <span class="breadcrumb-spacer"></span>
  <ng-content></ng-content>
</mat-toolbar>
