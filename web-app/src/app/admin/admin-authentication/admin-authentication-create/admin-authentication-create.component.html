<div class="create-page">
  <mat-horizontal-stepper [linear]="true" #stepper>
    <mat-step
      [stepControl]="titleCtrl"
      label="Title"
      errorMessage="Title is required."
    >
      <div class="step-content">
        <mat-form-field appearance="fill">
          <mat-label>Authentication Title</mat-label>
          <input
            matInput
            placeholder="e.g. Local LDAP"
            [formControl]="titleCtrl"
            required
          />
          <button
            matButton
            *ngIf="titleCtrl.value"
            matSuffix
            matIconButton
            (click)="titleCtrl.setValue('')"
            type="button"
          >
            <mat-icon>close</mat-icon>
          </button>
        </mat-form-field>

        <div>
          <button matButton matStepperNext [disabled]="titleCtrl.invalid">
            Next
          </button>
        </div>
      </div>
    </mat-step>

    <mat-step
      [stepControl]="nameCtrl"
      label="Type"
      errorMessage="Type is required."
    >
      <div class="step-content">
        <mat-form-field appearance="fill">
          <mat-label>Choose a type</mat-label>
          <mat-select [formControl]="nameCtrl" id="type" required>
            <mat-option
              *ngFor="let typeChoice of TYPE_CHOICES"
              [value]="typeChoice.name"
            >
              {{ typeChoice.title }}
            </mat-option>
          </mat-select>
        </mat-form-field>

        <div>
          <button matButton matStepperPrevious>Back</button>
          <button matButton matStepperNext [disabled]="nameCtrl.invalid">
            Next
          </button>
        </div>
      </div>
    </mat-step>

    <!-- SETTINGS -->
    <mat-step
      [stepControl]="settingsCtrl"
      label="Settings"
      errorMessage="Missing required settings."
    >
      <div class="step-content">
        <div [ngSwitch]="strategy.type">
          <admin-authentication-oidc
            *ngSwitchCase="'openidconnect'"
            [strategy]="strategy"
            (ngModelChange)="onSettingsChanged()"
          ></admin-authentication-oidc>

          <admin-authentication-oauth2
            *ngSwitchCase="'oauth'"
            [strategy]="strategy"
            (ngModelChange)="onSettingsChanged()"
          ></admin-authentication-oauth2>

          <admin-authentication-ldap
            *ngSwitchCase="'ldap'"
            [strategy]="strategy"
            (ngModelChange)="onSettingsChanged()"
          ></admin-authentication-ldap>

          <admin-authentication-saml
            *ngSwitchCase="'saml'"
            [strategy]="strategy"
            (ngModelChange)="onSettingsChanged()"
          ></admin-authentication-saml>

          <div *ngSwitchDefault class="no-type-hint">
            Select a type to load settings.
          </div>
        </div>

        <div>
          <button matButton matStepperPrevious>Back</button>
          <button matButton matStepperNext [disabled]="!isValid()">
            Next
          </button>
        </div>
      </div>
    </mat-step>

    <mat-step label="Login Button">
      <div class="step-content">
        <button-preview [strategy]="strategy"></button-preview>
        <div>
          <button matButton matStepperPrevious>Back</button>
          <button matButton matStepperNext>Next</button>
        </div>
      </div>
    </mat-step>

    <mat-step label="Summary">
      <div class="step-content">
        <h3 class="summary-title">
          {{ strategy.title }} ({{ strategy.type }})
        </h3>
        <button-preview
          [strategy]="strategy"
          [editable]="false"
        ></button-preview>

        <div [ngSwitch]="strategy.type">
          <admin-authentication-oidc
            *ngSwitchCase="'openidconnect'"
            [strategy]="strategy"
            [editable]="false"
          ></admin-authentication-oidc>

          <admin-authentication-oauth2
            *ngSwitchCase="'oauth'"
            [strategy]="strategy"
            [editable]="false"
          ></admin-authentication-oauth2>

          <admin-authentication-ldap
            *ngSwitchCase="'ldap'"
            [strategy]="strategy"
            [editable]="false"
          ></admin-authentication-ldap>

          <admin-authentication-saml
            *ngSwitchCase="'saml'"
            [strategy]="strategy"
            [editable]="false"
          ></admin-authentication-saml>
        </div>

        <div>
          <button matButton matStepperPrevious>Back</button>
          <button
            matButton="filled"
            type="button"
            (click)="save()"
            [disabled]="!isValid()"
          >
            Save
          </button>
        </div>
      </div>
    </mat-step>
  </mat-horizontal-stepper>
</div>
