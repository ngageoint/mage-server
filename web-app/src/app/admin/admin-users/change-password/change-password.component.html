<form [formGroup]="form" (ngSubmit)="updatePassword()">
  <h2 mat-dialog-title>Change Password</h2>

  <mat-dialog-content>
    <div *ngIf="error" class="server-error">
      <mat-icon>error_outline</mat-icon>
      {{ error }}
    </div>

    <mat-form-field appearance="fill">
      <mat-label>New Password</mat-label>
      <input matInput type="password" formControlName="password" autocomplete="new-password">
      <mat-error *ngIf="form.controls.password.hasError('required')">Password is required</mat-error>
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Confirm Password</mat-label>
      <input matInput type="password" formControlName="passwordconfirm" autocomplete="new-password">
      <mat-error *ngIf="form.controls.passwordconfirm.hasError('required')">Confirmation is required</mat-error>
      <mat-error *ngIf="form.controls.passwordconfirm.hasError('match')">Passwords must match</mat-error>
    </mat-form-field>

    <div class="password-strength">
      <div class="strength-header">
        <span class="strength-label">Password Strength</span>
        <span class="strength-text">{{ passwordStrength?.text }}</span>
      </div>
      <mat-progress-bar
        mode="determinate"
        [value]="passwordStrength?.value"
        [ngStyle]="{ '--password-bar-color': passwordStrength?.color }"
        class="strength-bar">
      </mat-progress-bar>
    </div>
  </mat-dialog-content>

  <mat-dialog-actions>
    <button matButton type="button" (click)="cancel()" [disabled]="saving" cdkFocusInitial data-testid="cancel-button">Cancel</button>
    <button matButton="filled" type="submit" [disabled]="form.invalid || saving" data-testid="save-button">
      <mat-icon fontSet="material-symbols-outlined">{{ saving ? 'progress_activity' : 'save' }}</mat-icon>
      Save Password
    </button>
  </mat-dialog-actions>
</form>
