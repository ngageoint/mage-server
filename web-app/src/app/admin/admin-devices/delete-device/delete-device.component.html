<h2 mat-dialog-title>Delete Device?</h2>

<mat-dialog-content>
    <p>Device <strong>"{{ data.device?.uid }}"</strong> will be permanently deleted, including associated location data. This action cannot be undone.</p>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton type="button" (click)="cancel()" cdkFocusInitial data-testid="cancel-button">Cancel</button>
    <button
        matButton
        type="button"
        class="delete-button"
        (click)="confirmDelete()"
        data-testid="delete-button"
    >
        <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
        Delete Device
    </button>
</mat-dialog-actions>
