<admin-breadcrumb [breadcrumbs]="breadcrumbs">
  <div class="nav-actions">
    <button matButton="filled" *ngIf="hasDeviceCreatePermission" (click)="createDevice()">
      <mat-icon>add</mat-icon>New Device
    </button>
  </div>
</admin-breadcrumb>

<div class="devices-page">
  <mat-card appearance="elevated" class="devices-card">
    <mat-card-header>
      <mat-card-title>Devices</mat-card-title>
    </mat-card-header>

    <div class="filter-row">
      <mat-chip-listbox [(ngModel)]="deviceStatusFilter" (change)="onStatusFilterChange($event.value)">
        <mat-chip-option value="all">All</mat-chip-option>
        <mat-chip-option value="registered">Active</mat-chip-option>
        <mat-chip-option value="unregistered">Inactive</mat-chip-option>
      </mat-chip-listbox>
    </div>

    <div class="toolbar">
      <search-bar placeholder="Search devices" [debounceMs]="300" (searchChange)="onSearchTermChanged($event)"></search-bar>
    </div>

    <mat-nav-list *ngIf="filteredDevices.length; else noDevices">
      <mat-list-item *ngFor="let device of filteredDevices" [routerLink]="['../devices', device.id]">
        <mat-icon matListItemIcon fontSet="material-symbols-outlined">{{ iconName(device) }}</mat-icon>
        <span matListItemTitle>{{ device.user?.displayName || 'No Associated User' }}</span>
        <span matListItemLine>{{ platformName(device) }} · {{ device.userAgent || 'Unknown' }}</span>
      </mat-list-item>
    </mat-nav-list>

    <ng-template #noDevices>
      <div class="empty-state">
        <mat-icon fontSet="material-symbols-outlined" class="empty-state-icon">devices</mat-icon>
        <div class="empty-state-text" *ngIf="deviceSearch; else noDevicesFound">No devices match your search</div>
        <ng-template #noDevicesFound>
          <div class="empty-state-text">No devices found</div>
        </ng-template>
      </div>
    </ng-template>

    <mat-paginator
      [length]="totalDevices"
      [pageSize]="searchOptions.page_size"
      [pageIndex]="searchOptions.page"
      [pageSizeOptions]="pageSizeOptions"
      showFirstLastButtons
      (page)="onPageChange($event)">
    </mat-paginator>
  </mat-card>
</div>
