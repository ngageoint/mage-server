<div class="settings-page">
  <mat-card appearance="elevated" class="settings-card">
    <mat-card-content>
      <div class="helper-text">
        <mat-icon>info</mat-icon>
        Show a disclaimer after login that users must accept before entering MAGE. Applies to all clients — Android, iOS, and Web.
      </div>

      <div class="show-section">
        <mat-slide-toggle [ngModel]="show()" (ngModelChange)="show.set($event); setDirty(true)">Show Disclaimer</mat-slide-toggle>
      </div>

      <mat-form-field appearance="fill">
        <mat-label>Disclaimer Title</mat-label>
        <input matInput [ngModel]="title()" (ngModelChange)="title.set($event); setDirty(true)" #titleModel="ngModel"
          [required]="show()" [disabled]="!show()" />
        @if (titleModel.invalid) {
          <mat-error>Disclaimer title is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field appearance="fill" subscriptSizing="dynamic">
        <mat-label>Disclaimer Text</mat-label>
        <textarea matInput [ngModel]="text()" (ngModelChange)="text.set($event); setDirty(true)" #textModel="ngModel"
          [required]="show()" [disabled]="!show()" rows="6"></textarea>
        @if (textModel.invalid) {
          <mat-error>Disclaimer text is required</mat-error>
        }
      </mat-form-field>
    </mat-card-content>
    <mat-divider></mat-divider>
    <div class="card-actions">
      <button matButton="filled" (click)="save()" [disabled]="titleModel.invalid || textModel.invalid">Save</button>
    </div>
  </mat-card>
</div>
