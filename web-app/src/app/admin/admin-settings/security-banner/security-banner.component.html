<div class="settings-page">
  <mat-card appearance="elevated" class="settings-card">
    <mat-card-content>
      <div class="helper-text">
        <mat-icon>info</mat-icon>
        Display a header and footer banner across all MAGE views. Configure the text content and colors for each.
      </div>

      <div class="banner-grid">
        <div class="banner-block">
          <h3 class="banner-title">Header</h3>

          <div class="show-section">
            <mat-slide-toggle [ngModel]="showHeader()" (ngModelChange)="showHeader.set($event); setDirty(true)">Show Header</mat-slide-toggle>
          </div>

          <mat-form-field appearance="fill">
            <mat-label>Header Text</mat-label>
            <input matInput [ngModel]="headerText()" (ngModelChange)="headerText.set($event); setDirty(true)" #headerTextModel="ngModel"
              [required]="showHeader()" [disabled]="!showHeader()" />
            @if (headerTextModel.invalid) {
              <mat-error>Header text is required</mat-error>
            }
          </mat-form-field>

          <div class="color-field">
            <label class="color-field-label" for="headerTextColor">Header Text Color</label>
            <color-picker [hexColor]="headerTextColor()" id="headerTextColor" (onColorChanged)="headerTextColor.set($event.color); setDirty(true)"></color-picker>
          </div>

          <div class="color-field">
            <label class="color-field-label" for="headerBackgroundColor">Header Background Color</label>
            <color-picker [hexColor]="headerBackgroundColor()" id="headerBackgroundColor" (onColorChanged)="headerBackgroundColor.set($event.color); setDirty(true)"></color-picker>
          </div>
        </div>

        <div class="banner-block">
          <h3 class="banner-title">Footer</h3>

          <div class="show-section">
            <mat-slide-toggle [ngModel]="showFooter()" (ngModelChange)="showFooter.set($event); setDirty(true)">Show Footer</mat-slide-toggle>
          </div>

          <mat-form-field appearance="fill">
            <mat-label>Footer Text</mat-label>
            <input matInput [ngModel]="footerText()" (ngModelChange)="footerText.set($event); setDirty(true)" #footerTextModel="ngModel"
              [required]="showFooter()" [disabled]="!showFooter()" />
            @if (footerTextModel.invalid) {
              <mat-error>Footer text is required</mat-error>
            }
          </mat-form-field>

          <div class="color-field">
            <label class="color-field-label" for="footerTextColor">Footer Text Color</label>
            <color-picker [hexColor]="footerTextColor()" id="footerTextColor" (onColorChanged)="footerTextColor.set($event.color); setDirty(true)"></color-picker>
          </div>

          <div class="color-field">
            <label class="color-field-label" for="footerBackgroundColor">Footer Background Color</label>
            <color-picker [hexColor]="footerBackgroundColor()" id="footerBackgroundColor" (onColorChanged)="footerBackgroundColor.set($event.color); setDirty(true)"></color-picker>
          </div>
        </div>
      </div>
    </mat-card-content>
    <mat-divider></mat-divider>
    <div class="card-actions">
      <button matButton="filled" (click)="save()" [disabled]="headerTextModel.invalid || footerTextModel.invalid">Save</button>
    </div>
  </mat-card>
</div>
