<div mat-dialog-title>Unsaved Changes</div>

<mat-dialog-content class="mat-typography">
  You have made changes that have not been saved.
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button matButton (click)="stay()" cdkFocusInitial>STAY HERE</button>
  <button matButton (click)="discard()">DISCARD CHANGES</button>
</mat-dialog-actions>
