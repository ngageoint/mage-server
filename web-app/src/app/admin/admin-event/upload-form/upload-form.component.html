<h2 mat-dialog-title>Upload Form For "{{ data.event.name }}"</h2>

<mat-dialog-content>
    <div class="error-alert" *ngIf="errorMessage">
        <mat-icon>error</mat-icon>
        <span>{{ errorMessage }}</span>
    </div>

    <form [formGroup]="formGroup" class="upload-form">
        <mat-form-field appearance="fill">
            <mat-label>Name</mat-label>
            <input matInput type="text" formControlName="name" placeholder="Form name">
            <mat-error *ngIf="hasError('name', 'required')">Name is required</mat-error>
        </mat-form-field>

        <mat-form-field appearance="fill">
            <mat-label>Description</mat-label>
            <textarea matInput formControlName="description" rows="3"
                placeholder="Brief description of the form."></textarea>
        </mat-form-field>

        <div class="color-field">
            <input type="color" class="color-swatch" formControlName="color" aria-label="Form color">
            <mat-form-field appearance="fill" class="color-text-field">
                <mat-label>Color</mat-label>
                <input matInput type="text" formControlName="color" placeholder="#000000">
                <mat-error *ngIf="hasError('color', 'required')">Color is required</mat-error>
                <mat-error *ngIf="hasError('color', 'pattern')">Color must be a valid hex color (e.g.,
                    #FF5733)</mat-error>
            </mat-form-field>
        </div>

        <div class="file-field">
            <button matButton="outlined" type="button" class="file-button" (click)="formFileInput.click()">
                <mat-icon>upload</mat-icon>
                {{ selectedFile ? selectedFile.name : 'Choose Form Archive' }}
            </button>
            <p class="help-text">Upload a previously exported MAGE form (.zip). Its fields and icons will be
                imported automatically.</p>
            <input #formFileInput type="file" hidden accept=".zip,application/zip"
                (change)="onFileSelected($event)">
        </div>
    </form>
</mat-dialog-content>

<mat-dialog-actions>
    <button matButton type="button" (click)="cancel()" [disabled]="saving">Cancel</button>
    <button matButton="filled" type="button" (click)="save()" [disabled]="formGroup.invalid || !selectedFile || saving">
        {{ saving ? 'Uploading...' : 'Upload Form' }}
    </button>
</mat-dialog-actions>
