<h2 mat-dialog-title>{{ isEditMode ? 'Edit Event' : 'Create a New Event' }}</h2>

<mat-dialog-content>
  <form [formGroup]="eventForm" class="event-form">
    <mat-form-field appearance="fill">
      <mat-label>Event Name</mat-label>
      <input matInput type="text" formControlName="name" placeholder="Enter event name" />
      @if (eventForm.controls.name.hasError('required')) {
        <mat-error>Name is required</mat-error>
      }
    </mat-form-field>

    <mat-form-field appearance="fill">
      <mat-label>Description</mat-label>
      <textarea matInput formControlName="description" rows="3" placeholder="Enter event description (optional)"></textarea>
    </mat-form-field>
  </form>
</mat-dialog-content>

@if (errorMessage()) {
  <div class="error-alert">
    <mat-icon>error</mat-icon>
    <span>{{ errorMessage() }}</span>
  </div>
}

<mat-dialog-actions>
  <button matButton type="button" (click)="cancel()">Cancel</button>
  <button matButton="filled" type="button" (click)="save()" [disabled]="eventForm.invalid">{{ isEditMode ? 'Save' : 'Create Event' }}</button>
</mat-dialog-actions>
