<div class="landing">
  <info class="map"></info>

  <div class="scroller">
    <div class="card">
      <div class="card__signin">
        <ingress landing="true" [api]="api" (complete)="onIngress()"></ingress>
      </div>

      <div class="footer">
        @if (contactEmailLink || contactPhoneLink) {
          <div class="help">
            Need help signing in?
            @if (contactEmailLink) {
              <a [href]="contactEmailLink">Email</a>
            }
            @if (contactEmailLink && contactPhoneLink) {
              or
            }
            @if (contactPhoneLink) {
              <a [href]="contactPhoneLink">call</a>
            }
            your Mage administrator.
          </div>
        }

        <div class="apps">
          <div class="apps__title">Get the Mage mobile app</div>
          <div class="apps__badges">
            <a href="https://itunes.apple.com/us/app/m.a.g.e./id1032815042?mt=8" target="_blank">
              <img class="apps__badge" src="/assets/images/ios_app_store_black.svg" alt="Download on the App Store">
            </a>
            <a href="https://play.google.com/store/apps/details?id=mil.nga.giat.mage&hl=en" target="_blank">
              <img class="apps__badge" src="/assets/images/google-play-badge.svg" alt="Get it on Google Play">
            </a>
          </div>
        </div>

        @if (api?.serverVersion) {
          <div class="version">Mage {{ api.serverVersion }}</div>
        }
      </div>
    </div>
  </div>
</div>
