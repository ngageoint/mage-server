<mat-action-list>
  @if (data.canClone) {
    <mat-list-item (click)="onOption(options.CLONE)" class="options-clone">
      <mat-icon matListItemIcon fontSet="material-symbols-outlined">content_copy</mat-icon>
      <span matListItemTitle>Clone Observation</span>
    </mat-list-item>
  }
  <mat-list-item (click)="onOption(options.DOWNLOAD)" class="options-download">
    <mat-icon matListItemIcon fontSet="material-symbols-outlined">download</mat-icon>
    <span matListItemTitle>Download Observation</span>
  </mat-list-item>
  @if (data.canDelete) {
    <mat-list-item (click)="onOption(options.DELETE)" class="options-delete">
      <mat-icon matListItemIcon fontSet="material-symbols-outlined">delete</mat-icon>
      <span matListItemTitle>Delete Observation</span>
    </mat-list-item>
  }
</mat-action-list>
