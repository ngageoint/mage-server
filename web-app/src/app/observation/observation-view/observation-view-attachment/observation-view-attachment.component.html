<div [hidden]="!filteredAttachments().length">
  <div class="title">{{field()?.title}}</div>

  <ng-container *ngIf="filteredAttachments().length">
    <mat-grid-list class="edit-attachments__grid" cols="2" rowHeight="210px" gutterSize="4px">
      <mat-grid-tile *ngFor="let attachment of filteredAttachments(); first as isFirst" [rowspan]="1" [colspan]="isFirst && (filteredAttachments().length % 2 === 1) ? 2 : 1">
        <observation-attachment [attachment]="attachment" clickable="true"></observation-attachment>
      </mat-grid-tile>
    </mat-grid-list>
  </ng-container>
</div>
