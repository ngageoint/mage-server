<div class="filter-section">
  <mat-form-field appearance="fill" class="observation-filter-field">
    <mat-label>Keyword Filter</mat-label>
    <input matInput [formControl]="keywordControl" placeholder="Enter keyword...">
    <mat-icon matSuffix class="keyword-hint-icon" matTooltip="All terms must match. Use quotes for exact phrases: &quot;bridge collapse&quot;">info_outline</mat-icon>
  </mat-form-field>
</div>

<div class="filter-section">
  <mat-form-field appearance="fill" class="observation-filter-field" subscriptSizing="dynamic">
    <mat-label>Condition Filter</mat-label>

    <mat-chip-grid #chipGridCondition>
      <ng-container *ngFor="let group of conditionGroups; let groupIndex = index">
        <span *ngIf="groupIndex > 0" class="group-separator"><span class="separator-badge separator-badge--and">and</span></span>
        <ng-container *ngFor="let condition of group.conditions; let conditionIndex = index">
          <span *ngIf="conditionIndex > 0" class="condition-separator"><span class="separator-badge separator-badge--or">or</span></span>
          <mat-chip-row [removable]="true" (removed)="removeCondition(groupIndex, conditionIndex)" [matTooltip]="condition.formName" [style.--mat-chip-outline-color]="condition.formColor">
            {{ condition.displayValue }}
            <mat-icon matChipRemove>cancel</mat-icon>
          </mat-chip-row>
        </ng-container>
      </ng-container>

      <mat-chip-row *ngIf="selectedField" class="condition-chip condition-chip--field" [removable]="true" (removed)="removeFieldChip()">
        {{ selectedField.title }}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
      <mat-chip-row *ngIf="selectedOperator" class="condition-chip condition-chip--operator" [removable]="true" (removed)="removeOperatorChip()">
        {{ selectedOperatorDisplay }}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>
      <mat-chip-row *ngIf="pendingValueDisplay" class="condition-chip condition-chip--value" [removable]="true" (removed)="removeValueChip()">
        {{ pendingValueDisplay }}
        <mat-icon matChipRemove>cancel</mat-icon>
      </mat-chip-row>

      <input
        *ngIf="!isDateValueState && !isNullOperatorState && !pendingValueDisplay"
        matInput
        #filterInput
        class="condition-filter-input"
        [class.condition-filter-input--new-row]="conditionState === 'field'"
        [formControl]="inputControl"
        [matChipInputFor]="chipGridCondition"
        [matAutocomplete]="auto"
        [placeholder]="inputPlaceholder"
        (keydown)="onInputKeydown($event)">

      <input
        *ngIf="isDateValueState"
        matInput
        class="condition-filter-input"
        [matChipInputFor]="chipGridCondition"
        [matDatepicker]="filterDatePicker"
        [placeholder]="selectedField?.title + ' ' + selectedOperator"
        (dateChange)="onDateSelected($event)">
    </mat-chip-grid>

    <mat-datepicker-toggle *ngIf="isDateValueState" matSuffix [for]="filterDatePicker"></mat-datepicker-toggle>
    <mat-datepicker #filterDatePicker></mat-datepicker>

    <mat-autocomplete
      #auto="matAutocomplete"
      (optionSelected)="onOptionSelected($event)">
      <ng-container *ngIf="conditionState === 'field'">
        <mat-optgroup *ngFor="let group of filteredFormGroups | async" [label]="group.formName">
          <mat-option *ngFor="let option of group.fields" [value]="option">
            <span ngProjectAs="mat-icon" class="form-color-rail" [style.background]="option.formColor"></span>
            {{ option.display }}
          </mat-option>
        </mat-optgroup>
      </ng-container>
      <ng-container *ngIf="conditionState !== 'field'">
        <mat-option *ngFor="let option of filteredOptions | async" [value]="option">
          {{ option.display }}
        </mat-option>
      </ng-container>
    </mat-autocomplete>
  </mat-form-field>

  <div class="observation-filter-actions">
    <ng-container *ngIf="!hasConditions">
      <button mat-stroked-button type="button" [disabled]="!hasValue" (click)="addOr()" matTooltip="Add filter condition">Add</button>
    </ng-container>
    <ng-container *ngIf="hasConditions">
      <button mat-stroked-button type="button" [disabled]="!hasValue" (click)="addOr()" matTooltip="Add to current group (matches if any apply)">Or</button>
      <button mat-stroked-button type="button" [disabled]="!hasValue" (click)="addAnd()" matTooltip="Add as new required group (must also match)">And</button>
    </ng-container>
  </div>
</div>
