<div class="geometry-wrapper" #geometry>
  <div class="geometry-field" [class.geometry-field--active]="edit">
    <div class="geometry-field__label" [class.geometry-field__label--active]="edit">{{definition().title}} {{definition().required ? '*' : ''}}</div>

    <div class="geometry-panel">
      <div class="geometry-panel__contents" [class.geometry-panel__flip]="edit">
        <div class="geometry-panel__view">
          <observation-edit-geometry-map [feature]="mapFeature()" (onEdit)="startGeometryEdit()"></observation-edit-geometry-map>
        </div>
        <div class="geometry-panel__edit">
          <observation-edit-geometry-form [feature]="editFeature()" (save)="saveGeometryEdit($event)" (cancel)="cancelGeometryEdit()"></observation-edit-geometry-form>
        </div>
      </div>
    </div>

  </div>

  <div class="geometry__underline" [class.geometry__underline--active]="edit"></div>

  <div class="geometry-help">
    @if (mapFeature() && mapFeature().geometry) {
      <span class="geometry-help__text">{{mapFeature().geometry | geometry:5}}</span>
    }
  </div>

</div>
