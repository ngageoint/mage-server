<div class="geometry-wrapper">
  <div class="geometry-field">
    <div class="geometry-field__label">{{definition().title}} {{definition().required ? '*' : ''}}</div>

    <div class="geometry-panel">
      <observation-edit-geometry-map [feature]="mapFeature()" (onEdit)="startGeometryEdit()"></observation-edit-geometry-map>
    </div>

  </div>

  <div class="geometry__underline"></div>

  <div class="geometry-help">
    @if (mapFeature() && mapFeature().geometry) {
      <span class="geometry-help__text">{{mapFeature().geometry | geometry:5}}</span>
    }
  </div>

</div>

<ng-template #editor>
  <div class="geometry-editor">
    <div class="geometry-editor__content">
      <observation-edit-geometry-form #form [title]="definition()?.title || 'Location'" [feature]="editFeature()" (save)="saveGeometryEdit($event)" (cancel)="cancelGeometryEdit()"></observation-edit-geometry-form>

      <!-- Sits under the list, sticks to the bottom once the list scrolls -->
      @if (!form.pasteOpen) {
        <div class="geometry-editor__actions">
          <span class="geometry-editor__status" [class.geometry-editor__status--warn]="form.hasCrossingEdges()">{{ form.statusText() }}</span>
          <button matButton type="button" (click)="form.onCancel()">Cancel</button>
          <button matButton="filled" type="button" (click)="form.onSave()" [disabled]="!form.canSave()">Done</button>
        </div>
      }
    </div>
  </div>
</ng-template>
