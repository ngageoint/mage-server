<div class="edit-location">
  <div class="chip-type">
    <div class="chip-type__label">{{ title() }}</div>
    <mat-chip-listbox selectable="true">
      <mat-chip-option [selected]="!pasteOpen && selectedShapeType === 'Point'" (click)="shapeTypeChanged('Point')">Point</mat-chip-option>
      <mat-chip-option [selected]="!pasteOpen && selectedShapeType === 'LineString'" (click)="shapeTypeChanged('LineString')">Line</mat-chip-option>
      <mat-chip-option [selected]="!pasteOpen && selectedShapeType === 'Polygon'" (click)="shapeTypeChanged('Polygon')">Polygon</mat-chip-option>
    </mat-chip-listbox>
    <button
      matIconButton
      type="button"
      class="chip-type__paste"
      [class.chip-type__paste--active]="pasteOpen"
      (click)="pasteOpen ? closePaste() : openPaste()"
      matTooltip="Paste coordinates"
      aria-label="Paste coordinates"
    >
      <mat-icon fontSet="material-symbols-outlined">content_paste</mat-icon>
    </button>
  </div>

  <div class="help">{{ helpText() }}</div>

  @if (pasteOpen) {
    <div class="paste">
      <mat-form-field appearance="fill" class="paste__field">
        <mat-label>Coordinates, GeoJSON, WKT or KML</mat-label>
        <textarea
          matInput
          rows="6"
          [ngModel]="pasteText"
          (ngModelChange)="onPasteChange($event)"
          placeholder="39.73915, -104.98470&#10;39° 44' 21&quot; N, 104° 59' 05&quot; W&#10;13SEE0171300010"
        ></textarea>
        <mat-hint [class.paste__error]="hasPasteError()">{{ pasteSummary() }}</mat-hint>
      </mat-form-field>

      <div class="paste__actions">
        <button matButton type="button" (click)="closePaste()">Cancel</button>
        <button matButton="outlined" type="button" [disabled]="!canApplyPaste()" (click)="applyPaste()">Apply</button>
      </div>
    </div>
  } @else {
    <embedded-control-search
      class="search"
      [label]="searchLabel()"
      (onSearch)="onSearchResult($event)"
    ></embedded-control-search>

    <div class="points">
      @for (coordinate of coordinates; track $index; let i = $index) {
        <mat-form-field appearance="fill" class="point">
          <mat-label>{{ rowLabel(coordinate, i) }}</mat-label>
          <input
            matInput
            #rowInput
            [ngModel]="coordinate.text"
            (ngModelChange)="onRowChange(coordinate, $event)"
            (focus)="selectVertex(i)"
            (keydown.enter)="$event.preventDefault(); applyRow(coordinate)"
            (keydown.escape)="resetRow(coordinate)"
            (blur)="applyRow(coordinate)"
          />
          @if (canDelete()) {
            <button matSuffix matIconButton type="button" (click)="removeVertex(i)" aria-label="Remove point">
              <mat-icon fontSet="material-symbols-outlined">delete</mat-icon>
            </button>
          }
          <mat-hint [class.point__error]="coordinate.error">{{ rowHint(coordinate) }}</mat-hint>
        </mat-form-field>
      }
    </div>
  }
</div>
