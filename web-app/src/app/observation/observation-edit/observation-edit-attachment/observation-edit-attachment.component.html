<div class="attachment-field">
  <div class="attachment-field__header">
    <div class="attachment-field__label">
      {{ definition()?.title }}{{ definition()?.min > 0 ? ' *' : '' }}
    </div>
  </div>

  <div class="attachment-field__body">
    @if (allAttachments().length) {
      <div class="edit-attachments__grid">
        @for (attachment of allAttachments(); track attachment.id; let isFirst = $first) {
          <div class="edit-attachments__item" [class.edit-attachments__item--full]="isFirst && allAttachments().length % 2 === 1">
            @if (!attachment.file) {
              <observation-attachment [attachment]="attachment" edit="true"
                (delete)="deleteAttachment(attachment)"></observation-attachment>
            } @else {
              <attachment-upload [url]="url()" [attachment]="attachment"
                (remove)="removeAttachment($event)"></attachment-upload>
            }
          </div>
        }
      </div>
    } @else {
      <div class="no-attachments">
        <mat-icon class="no-attachments__icon">insert_drive_file</mat-icon>
        <div class="no-attachments__text">No Attachments</div>
      </div>
    }
  </div>

  <div class="attachment-actions">
    <button matButton="outlined" type="button" (click)="file.click()">Add Attachment</button>

    <input [hidden]="true" type="file" #file multiple (change)="onAttachmentFile($event)" />
  </div>
</div>
