<div class="datetime">
  <div class="date">
    <mat-form-field appearance="fill">
      <mat-label>{{ definition()?.title }} Date</mat-label>
      <input matInput [matDatepicker]="datePicker" [(ngModel)]="date" [required]="definition()?.required"
        (ngModelChange)="onDate()" #dateModel="ngModel" autocomplete="off" />
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
      @if (dateModel.errors?.required && !dateModel.errors?.matDatepickerParse) {
        <mat-error>
          Date is required
        </mat-error>
      }
      @if (dateModel.errors?.matDatepickerParse) {
        <mat-error>
          Invalid date
        </mat-error>
      }
    </mat-form-field>
  </div>

  <div class="time">
    <mat-form-field appearance="fill">
      <mat-label>
        {{ definition()?.title }} Time
        {{ timeZone === 'gmt' ? '(GMT)' : '(Local)' }}
      </mat-label>
      <input matInput [matTimepicker]="timePicker" [(ngModel)]="timeValue"
        (ngModelChange)="onTime()" autocomplete="off" />
      <mat-timepicker-toggle matSuffix [for]="timePicker"></mat-timepicker-toggle>
      <mat-timepicker #timePicker interval="30m"></mat-timepicker>
    </mat-form-field>
  </div>
</div>
