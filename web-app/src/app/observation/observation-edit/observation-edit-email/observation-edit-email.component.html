<div [formGroup]="formGroup()">
  <mat-form-field appearance="fill">
    <mat-label>{{definition()?.title}}</mat-label>
    <input matInput type="email" formControlName="{{definition()?.name}}" [required]="definition()?.required" email>
    @if (formGroup()?.get(definition()?.name)?.hasError('required')) {
      <mat-error>You must enter a value</mat-error>
    }
    @if (formGroup()?.get(definition()?.name)?.hasError('email')) {
      <mat-error>Not a valid email</mat-error>
    }
  </mat-form-field>
</div>
