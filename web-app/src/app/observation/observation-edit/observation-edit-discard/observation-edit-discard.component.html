<div mat-dialog-title>Discard Changes?</div>
<div mat-dialog-content>
  <p>Your observation changes will be lost.</p>
</div>
<div mat-dialog-actions align="end">
  <button matButton (click)="close()">Cancel</button>
  <button matButton class="discard-button" (click)="discard()">Discard</button>
</div>
