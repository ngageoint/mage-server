<div class="container" [class.compact]="compact">
  <div *ngIf="!compact" class="header">
    <div class="header__title">{{title}}</div>
  </div>

  <div class="disclaimer">
    <div class="disclaimer__text">{{text}}</div>
  </div>

  <div class="actions">
    <button class="actions__button" matButton="outlined" (click)="onReject()">Exit</button>
    <button class="actions__button" matButton="filled" (click)="onAccept()">Accept</button>
  </div>

</div>
