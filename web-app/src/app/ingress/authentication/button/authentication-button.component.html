<button class="authentication-button" [style.background-color]="color()" matButton="filled" (click)="onClick()">
  <div class="authentication-button-container">
    @if (icon()) {
      <div class="authentication-button__icon">
        <img class="authentication-button__image" [src]="'data:image/png;base64,' + icon()">
      </div>
    }
    <div class="authentication-button__text" [style.color]="textColor()">{{ label() }}</div>
    @if (icon()) {
      <div class="spacer"></div>
    }
  </div>
</button>
