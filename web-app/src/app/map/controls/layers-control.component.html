<button
  matMiniFab
  class="map-control-fab"
  matTooltip="Map Layers"
  matTooltipPosition="left"
  (click)="toggleLayerMenu()">
  <mat-icon
    [hidden]="showClose"
    [@rotatedState]="state"
    (@rotatedState.done)="onDone($event)">
    layers
  </mat-icon>

  <mat-icon
    [hidden]="!showClose"
    [@rotatedStateClose]="stateClosed"
    (@rotatedStateClose.done)="onCloseDone($event)">
    close
  </mat-icon>
</button>
