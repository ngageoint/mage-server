<div class="zoom">
  <button
    #zoomOutButton
    matMiniFab
    class="map-control-fab"
    (click)="onZoomOut($event)"
  >
    <mat-icon>remove</mat-icon>
  </button>

  <button
    #zoomInButton
    matMiniFab
    class="map-control-fab"
    (click)="onZoomIn($event)"
  >
    <mat-icon>add</mat-icon>
  </button>
</div>
