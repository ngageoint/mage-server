<div class="zoom">
  <button #zoomOutButton mat-mini-fab color="basic" (click)="onZoomOut($event)">
    <mat-icon color="primary">remove</mat-icon>
  </button>

  <button #zoomInButton mat-mini-fab color="basic" (click)="onZoomIn($event)">
    <mat-icon color="primary">add</mat-icon>
  </button>
</div>
