<div class="item-container">
  <div class="item-content">
    @if (multi()) {
      <mat-checkbox
        class="item-action"
        [checked]="layer().selected"
        (click)="$event.stopPropagation()"
        (change)="checkChanged($event)">
      </mat-checkbox>
    } @else {
      <mat-radio-button
        class="item-action"
        [checked]="layer().selected"
        (click)="$event.stopPropagation()"
        (change)="radioChanged()">
      </mat-radio-button>
    }

    <span class="item-name">{{ layer().name }}</span>
  </div>
</div>
