<mat-list-item (click)="onItemSelect()">
  <mat-icon *ngIf="!feed.mapStyle?.icon" matListItemIcon class="item__icon">place</mat-icon>
  <mage-static-icon-img *ngIf="feed.mapStyle?.icon" [iconRef]="feed.mapStyle.icon" matListItemIcon
    class="item__icon"></mage-static-icon-img>

  <div class="item__content">
    <ng-container *ngIf="hasContent; else noContent">
      <span class="item__timestamp">{{timestamp | moment}}</span>
      <span class="item__primary">{{primary || "&nbsp;"}}</span>
      <span class="item__secondary">{{secondary || "&nbsp;"}}</span>
    </ng-container>
    <ng-template #noContent>
      <span class="item__primary">{{feed.title}}</span>
    </ng-template>
  </div>
</mat-list-item>
