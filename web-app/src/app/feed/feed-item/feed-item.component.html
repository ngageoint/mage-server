<mat-toolbar>
  <button mat-icon-button color="primary" (click)="close()">
    <mat-icon>arrow_back</mat-icon>
  </button>

  <span class="title">{{ feed?.title }}</span>
</mat-toolbar>

<div class="feed-item">
  <mat-card class="feed-item__card">
    <div class="card-header">
      <div class="card-header-text">
        <div class="card-overline">{{ date }}</div>
        <div class="card-title">{{ primary }}</div>
        <div class="card-subtitle">{{ secondary }}</div>
      </div>

      <div class="card-avatar">
        <mat-icon *ngIf="!feed.icon" color="primary">place</mat-icon>
        <mage-static-icon-img *ngIf="feed.icon" [iconRef]="feed.icon"></mage-static-icon-img>
      </div>
    </div>

    <div class="card-image">
      <map-clip class="map" [feature]="mapFeature"></map-clip>
    </div>

    <div class="card-actions">
      <button mat-button color="primary" (click)="onLocationClick()">
        <mat-icon>gps_fixed</mat-icon>
        <span>{{ item?.geometry | geometry:5 }}</span>
      </button>
    </div>
  </mat-card>

  <mat-card class="feed-item__card">
    <div class="section-title">Properties</div>

    <mat-card-content>
      <div *ngFor="let property of properties" class="property-row">
        <div class="item">
          <div class="property-key">{{ property.key }}</div>
          <div class="property-value">{{ property.value }}</div>
        </div>
        <mat-divider></mat-divider>
      </div>
    </mat-card-content>
  </mat-card>
</div>
