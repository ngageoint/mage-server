<h2 mat-dialog-title>Exports</h2>

<mat-dialog-content class="export-content">
  <mat-icon>save_alt</mat-icon>
  <span class="empty-headline">No Exports</span>
  <span class="empty-body">Create a new export and it will show up here.</span>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button matButton (click)="openExport()" cdkFocusInitial>New Export</button>
</mat-dialog-actions>
