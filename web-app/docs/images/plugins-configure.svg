<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img" aria-labelledby="t d"><title id="t">Plugin configuration workflow diagram - synthetic screen-reference illustration, not a screenshot</title><desc id="d">Workflow diagram, not an app screen: operator installs and registers plugin, MAGE admin shows plugin pages only when declared, some plugins add Feeds service types. All names and values are fictional examples.</desc><style>text{font-family:Roboto,'Helvetica Neue',Arial,sans-serif;fill:#181c22;font-size:15px}.t{font-size:22px}.m{font-weight:500}.s{font-size:13px;fill:#43474d}.xs{font-size:12px;fill:#43474d}.w{fill:#fdfcff}.p{fill:#0060a8}.ter{fill:#873ea3}.co{fill:#c2410c;font-size:13px;font-weight:700}</style><rect x="0" y="0" width="1200" height="800" rx="0" fill="#f8f9ff"/><text x="60" y="70" style="font-size:28px;font-weight:500">Plugin workflow (diagram - not an app screen)</text><text x="60" y="102" class="s" style="font-size:15px;">Installation happens outside the browser. MAGE administration only configures plugins already installed and registered.</text><rect x="60" y="152" width="330" height="250" rx="16" fill="rgba(24,28,34,0.10)"/><rect x="60" y="150" width="330" height="250" rx="16" fill="#fdfcff"/><rect x="60" y="150" width="330" height="56" rx="16" fill="#43474d"/><rect x="60" y="190" width="330" height="16" rx="0" fill="#43474d"/><path transform="translate(78 166) scale(1.000)" fill="#fdfcff" d="M4 6h18V4H4c-1.1 0-2 .9-2 2v11H0v3h14v-3H4V6zm19 2h-6c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h6c.55 0 1-.45 1-1V9c0-.55-.45-1-1-1zm-1 9h-4v-7h4v7z"/><text x="114" y="186" style="fill:#fdfcff;font-size:18px;font-weight:500">1  Server operator</text><text x="80" y="240" style="font-size:15px;">Trusted, version-compatible plugin</text><text x="80" y="266" style="font-size:15px;">Install service / web packages</text><text x="80" y="292" style="font-size:15px;">Register: mage.service --plugin</text><text x="80" y="318" style="font-size:15px;">Back up; test separately first</text><rect x="440" y="152" width="330" height="250" rx="16" fill="rgba(24,28,34,0.10)"/><rect x="440" y="150" width="330" height="250" rx="16" fill="#fdfcff"/><rect x="440" y="150" width="330" height="56" rx="16" fill="#43474d"/><rect x="440" y="190" width="330" height="16" rx="0" fill="#43474d"/><path transform="translate(458 166) scale(1.000)" fill="#fdfcff" d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zM9 17H7v-5h2v5zm4 0h-2v-3h2v3zm0-5h-2v-2h2v2zm4 5h-2V7h2v10z"/><text x="494" y="186" style="fill:#fdfcff;font-size:18px;font-weight:500">2  Start test deployment</text><text x="460" y="240" style="font-size:15px;">Check plugin init errors in logs</text><text x="460" y="266" style="font-size:15px;">Sign in as authorized admin</text><text x="460" y="292" style="font-size:15px;">No marketplace or upload-to-</text><text x="460" y="318" style="font-size:15px;">install in the browser</text><rect x="820" y="152" width="330" height="250" rx="16" fill="rgba(24,28,34,0.10)"/><rect x="820" y="150" width="330" height="250" rx="16" fill="#fdfcff"/><rect x="820" y="150" width="330" height="56" rx="16" fill="#0060a8"/><rect x="820" y="190" width="330" height="16" rx="0" fill="#0060a8"/><path transform="translate(838 166) scale(1.000)" fill="#fdfcff" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 13.1c-1.9-.6-3.5-1.9-4.5-3.6 1-1.4 2.9-2.2 4.5-2.2s3.5.8 4.5 2.2c-1 1.7-2.6 3-4.5 3.6z"/><text x="874" y="186" style="fill:#fdfcff;font-size:18px;font-weight:500">3  Configure in MAGE</text><text x="840" y="240" style="font-size:15px;">Plugin settings page (if any)</text><text x="840" y="266" style="font-size:15px;">Plugin-specific options</text><text x="840" y="292" style="font-size:15px;">Verify a real operation, not just</text><text x="840" y="318" style="font-size:15px;">a visible menu item</text><path d="M390 275 L436 275" stroke="#74777e" stroke-width="3" fill="none"/><path d="M436 275 l-12 -7 v14z" fill="#74777e"/><path d="M770 275 L816 275" stroke="#74777e" stroke-width="3" fill="none"/><path d="M816 275 l-12 -7 v14z" fill="#74777e"/><rect x="120" y="452" width="420" height="280" rx="16" fill="rgba(24,28,34,0.10)"/><rect x="120" y="450" width="420" height="280" rx="16" fill="#fdfcff"/><text x="140" y="484" style="font-weight:500">Admin navigation (only if declared)</text><path transform="translate(156 504) scale(0.917)" fill="#43474d" d="M6.18 15.64a2.18 2.18 0 010 4.36 2.18 2.18 0 010-4.36M4 4.44A15.56 15.56 0 0119.56 20h-2.83A12.73 12.73 0 004 7.27V4.44m0 5.66a9.9 9.9 0 019.9 9.9h-2.83A7.07 7.07 0 004 12.93V10.1z"/><text x="192" y="522" style="font-size:15px;font-weight:500">Feeds</text><path transform="translate(156 556) scale(0.917)" fill="#43474d" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/><text x="192" y="574" style="font-size:15px;font-weight:500">Places</text><rect x="140" y="598" width="380" height="44" rx="22" fill="#d3e4ff"/><path transform="translate(156 608) scale(0.917)" fill="#001c38" d="M12 1L3 5v6c0 5.55 3.84 10.74 9 12 5.16-1.26 9-6.45 9-12V5l-9-4zm0 6a2.5 2.5 0 110 5 2.5 2.5 0 010-5zm0 13.1c-1.9-.6-3.5-1.9-4.5-3.6 1-1.4 2.9-2.2 4.5-2.2s3.5.8 4.5 2.2c-1 1.7-2.6 3-4.5 3.6z"/><text x="192" y="626" style="font-size:15px;font-weight:500">Example Plugin</text><text x="140" y="700" class="s">Plugin tabs appear only when a plugin declares one.</text><rect x="620" y="452" width="460" height="280" rx="16" fill="rgba(24,28,34,0.10)"/><rect x="620" y="450" width="460" height="280" rx="16" fill="#fdfcff"/><text x="640" y="484" style="font-weight:500">Or: new service type under Feeds</text><rect x="640" y="502" width="420" height="48" rx="8" fill="#f2f3fa"/><path transform="translate(654 514) scale(1.000)" fill="#43474d" d="M19.35 10.04A7.49 7.49 0 0012 4C9.11 4 6.6 5.64 5.35 8.04A5.994 5.994 0 000 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96z"/><text x="690" y="532">Example Plugin Service (synthetic)</text><text x="640" y="584" style="font-size:15px;">Continue with the Feeds guide: New Feed</text><text x="640" y="610" style="font-size:15px;">-&gt; Choose a Service and Topic.</text><text x="640" y="660" class="s">Promote only after approval; preserve observations,</text><text x="640" y="682" class="s">resources and security files.</text><rect x="816" y="146" width="338" height="258" rx="18" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="7 4"/><circle cx="1158" cy="142" r="13" fill="#c2410c"/><text x="1158" y="147" style="fill:#fdfcff;font-size:14px;font-weight:700" text-anchor="middle">1</text><rect x="0" y="770" width="1200" height="30" rx="0" fill="#fff4e5"/><line x1="0" y1="770" x2="1200" y2="770" stroke="#f0c48a" stroke-width="1"/><text x="16" y="790" style="fill:#7a3e00;font-size:13px">Synthetic screen-reference illustration based on the current MAGE web app - fictional example data, not a screenshot.</text></svg>
