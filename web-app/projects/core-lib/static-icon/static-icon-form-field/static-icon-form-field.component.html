<div [formGroup]="form" class="form">
  <img *ngIf="iconSrc" class="icon-image" [attr.src]="iconSrc" />
  <button mat-button color="primary" (click)="file.click()">Choose a File</button>
  <input [hidden]="true" type="file" #file accept="image/*" (change)="onSelectIcon($event)">
  <input type="hidden" formControlName="iconRefType"/>
  <input type="hidden" formControlName="iconRefToken"/>
</div>
