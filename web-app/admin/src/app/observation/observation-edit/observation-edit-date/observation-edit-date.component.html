<div class="datetime">
  <div class="date">
    <mat-form-field appearance="fill">
      <mat-label>{{ definition.title }} Date</mat-label>
      <input matInput [matDatepicker]="datePicker" [(ngModel)]="date" [required]="definition.required"
        (ngModelChange)="onDate()" #dateModel="ngModel" autocomplete="off" />
      <mat-datepicker-toggle matSuffix [for]="datePicker"></mat-datepicker-toggle>
      <mat-datepicker #datePicker></mat-datepicker>
      <mat-error *ngIf="
          dateModel.errors?.required && !dateModel.errors?.matDatepickerParse
        ">
        Date is required
      </mat-error>
      <mat-error *ngIf="dateModel.errors?.matDatepickerParse">
        Invalid date
      </mat-error>
    </mat-form-field>
  </div>

  <div class="time">
    <mat-form-field appearance="fill">
      <mat-label>{{ definition.title }} Time
        {{ timeZone === 'gmt' ? '(GMT)' : '(Local)' }}</mat-label>
      <input matInput #timeInput type="time" step="60" [(ngModel)]="time" (ngModelChange)="onTime()"
        #timeModel="ngModel" autocomplete="off" />
      <button mat-icon-button matSuffix type="button" aria-label="Open time selector" (click)="openTimePicker($event)">
        <mat-icon>schedule</mat-icon>
      </button>
      <mat-error *ngIf="timeInvalid">Invalid time</mat-error>
    </mat-form-field>
  </div>
</div>
