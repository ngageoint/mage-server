<form [formGroup]="layerForm" class="modal-container">
    <div class="modal-header">
      <h2>Create a New Layer</h2>
    </div>
  
    <div class="modal-body">
      <!-- GLOBAL ERROR -->
      <div *ngIf="errorMessage" class="error-alert">
        <i class="fa fa-exclamation-triangle"></i>
        <span>{{ errorMessage }}</span>
      </div>
  
      <!-- NAME -->
      <div class="field-shell">
        <mat-form-field appearance="fill">
          <mat-label>Layer Name</mat-label>
          <input
            matInput
            type="text"
            formControlName="name"
            placeholder="Enter layer name"
          />
        </mat-form-field>
  
        <div
          class="error-popover"
          *ngIf="
            layerForm.controls.name.invalid &&
            (layerForm.controls.name.touched || layerForm.controls.name.dirty)
          "
        >
          <div *ngIf="layerForm.controls.name.hasError('required')">
            Name is required
          </div>
          <div *ngIf="layerForm.controls.name.hasError('duplicateName')">
            A layer with this name already exists
          </div>
        </div>
      </div>
  
      <!-- TYPE -->
      <div class="field-shell">
        <mat-form-field appearance="fill">
          <mat-label>Layer Type</mat-label>
          <mat-select formControlName="type" (selectionChange)="onTypeChange()">
            <mat-option value="Imagery">Imagery</mat-option>
            <mat-option value="Feature">Feature</mat-option>
            <mat-option value="GeoPackage">GeoPackage</mat-option>
          </mat-select>
        </mat-form-field>
  
        <div
          class="error-popover"
          *ngIf="
            layerForm.controls.type.invalid &&
            (layerForm.controls.type.touched || layerForm.controls.type.dirty)
          "
        >
          Type is required
        </div>
  
        <!-- TYPE DESCRIPTION -->
        <div class="field-hint">
          <span *ngIf="layerForm.get('type')?.value === 'Imagery'">
            WMS, XYZ or TMS Layers
          </span>
          <span *ngIf="layerForm.get('type')?.value === 'Feature'">
            Static layers (KML/KMZ)
          </span>
          <span *ngIf="layerForm.get('type')?.value === 'GeoPackage'">
            Downloadable GeoPackage layers
          </span>
        </div>
      </div>
  
      <!-- IMAGERY -->
      <div *ngIf="layerForm.get('type')?.value === 'Imagery'" class="conditional-section">
        <mage-imagery-layer-settings
          [config]="imageryConfig"
          (configChange)="onImageryConfigChange($event)"
          (wmsLayersSelected)="onWmsLayersSelected($event)"
        ></mage-imagery-layer-settings>
  
        <div class="field-shell">
          <mat-checkbox formControlName="base">Base Layer</mat-checkbox>
        </div>
      </div>
  
      <!-- GEOPACKAGE -->
      <div *ngIf="layerForm.get('type')?.value === 'GeoPackage'" class="conditional-section">
        <div class="file-upload-container">
          <input
            type="file"
            id="geopackage-file"
            class="file-input"
            accept=".gpkg"
            (change)="onGeoPackageFileSelected($event)"
          />
  
          <label for="geopackage-file" class="file-label">
            <i class="fa fa-upload"></i>
            <span *ngIf="!geopackageFileName">Select GeoPackage file...</span>
            <span *ngIf="geopackageFileName" class="file-name">
              {{ geopackageFileName }}
            </span>
          </label>
  
          <div class="field-hint">
            Select a .gpkg file to upload
          </div>
        </div>
      </div>
  
      <!-- DESCRIPTION -->
      <div class="field-shell">
        <mat-form-field appearance="fill">
          <mat-label>Description</mat-label>
          <textarea
            matInput
            formControlName="description"
            rows="3"
            placeholder="Enter layer description (optional)"
          ></textarea>
        </mat-form-field>
      </div>
    </div>
  
    <div class="modal-footer">
      <button type="button" class="action-button" (click)="cancel()">
        <i class="fa fa-times"></i>
        Cancel
      </button>
  
      <button
        type="button"
        class="action-button btn-primary"
        (click)="save()"
        [disabled]="canSave"
      >
        <i class="fa fa-save"></i>
        Create Layer
      </button>
    </div>
  </form>
