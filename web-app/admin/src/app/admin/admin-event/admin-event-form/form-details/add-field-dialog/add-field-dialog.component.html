<h2 mat-dialog-title>Add New Field</h2>

<mat-dialog-content>
    <div class="dialog-form">
        <div class="config-inline-item">
            <div class="config-inline-label">
                <strong>Field Type</strong>
            </div>
            <div class="config-inline-control">
                <select class="form-input" [(ngModel)]="field.type" name="fieldType">
                    <option *ngFor="let type of data.fieldTypes" [value]="type.name">
                        {{ type.title }}
                    </option>
                </select>
            </div>
        </div>

        <div class="config-inline-item">
            <div class="config-inline-label">
                <strong>Field Title *</strong>
            </div>
            <div class="config-inline-control">
                <input type="text" class="form-input" [(ngModel)]="field.title" placeholder="Enter field title"
                    name="fieldTitle" required>
            </div>
        </div>

        <div class="checkbox-section">
            <label class="checkbox-label">
                <input type="checkbox" [(ngModel)]="field.required" name="fieldRequired">
                <span>Required Field</span>
            </label>
            <p class="field-hint">Users must enter a value for this field.</p>
        </div>
    </div>
</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="onCancel()">Cancel</button>
    <button mat-button color="primary" (click)="onAdd()" [disabled]="!field.title" cdkFocusInitial>Add Field</button>
</mat-dialog-actions>
