<form [formGroup]="deviceForm" class="modal-container">
  <div class="modal-header">
    <h2>Create a New Device</h2>
  </div>

  <div class="modal-body">
    <div *ngIf="errorMessage" class="error-alert">
      <i class="fa fa-exclamation-triangle"></i>
      <span>{{ errorMessage }}</span>
    </div>

    <div class="field-shell">
      <mat-form-field appearance="fill">
        <mat-label>Device UID</mat-label>
        <input
          matInput
          type="text"
          formControlName="uid"
          placeholder="ex: 01:02:03:04:05:06:07"
        />
      </mat-form-field>

      <div
        class="error-popover"
        *ngIf="
          deviceForm.controls.uid.invalid &&
          (deviceForm.controls.uid.touched || deviceForm.controls.uid.dirty)
        "
      >
        UID is required
      </div>
    </div>

    <div class="field-shell">
      <mat-form-field appearance="fill">
        <mat-label>Description</mat-label>
        <textarea
          matInput
          formControlName="description"
          rows="3"
          placeholder="Enter device description (optional)"
        ></textarea>
      </mat-form-field>
    </div>

    <div class="user-search-shell">
      <user-search-box
        placeholder="Pick a contact user..."
        (userSelected)="onPointOfContactSelected($event)"
      ></user-search-box>
    </div>
  </div>

  <div class="modal-footer">
    <button type="button" class="action-button" (click)="cancel()">
      <i class="fa fa-times"></i>
      Cancel
    </button>

    <button
      type="button"
      class="action-button btn-primary"
      (click)="save()"
      [disabled]="deviceForm.invalid"
    >
      <i class="fa fa-save"></i>
      Create Device
    </button>
  </div>
</form>
